[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "nitro"
version = "0.1.0"
description = "Async-first Python web framework with a bundled Rust server"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Mario Ritzerfeld", email = "m.ritzerfeld@jaldis.com" }]
keywords = ["async", "web", "framework", "http3", "webtransport"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "jinja2>=3.1.0",
    "aiofiles>=25.1.0",
    "aiosmtplib>=5.1.1",
    "click>=8.4",
    "python-multipart>=0.0.32",
    "regex>=2026.5.9",
    "cryptography>=48",
]

[project.optional-dependencies]
aws = ["aioboto3>=15.5.0"]
azure = ["azure-storage-blob>=12.30.0"]
sendgrid = ["sendgrid>=6.12.5"]
redis = ["redis[hiredis]>=8.0.0"]
memcached = ["emcache>=1.3.3; python_version < '3.14'"]
email-oauth = ["authlib>=1.7.2"]
all = [
    "aioboto3>=15.5.0",
    "authlib>=1.7.2",
    "azure-storage-blob>=12.30.0",
    "emcache>=1.3.3; python_version < '3.14'",
    "redis[hiredis]>=8.0.0",
    "sendgrid>=6.12.5",
]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "httpx>=0.28.1",
    "websockets>=15",
    "aioquic>=1.3",
]

[project.scripts]
nitro = "nitro.cli:main"

[tool.maturin]
module-name = "nitro._nitro"
manifest-path = "crates/nitro-py/Cargo.toml"
python-source = "."
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
