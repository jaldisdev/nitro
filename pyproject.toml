[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "nitro"
version = "0.1.0"
description = "Async-first Python web framework with a bundled Rust server"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Mario Ritzerfeld", email = "oss@jaldis.com" }]
keywords = ["async", "web", "framework", "http3", "webtransport"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "jinja2>=3.1.0",
    "aiofiles>=25.1.0",
    "aiosmtplib>=5.1.2",
    "click>=8.4",
    "python-multipart>=0.0.32",
    "regex>=2026.7.19",
]

[project.optional-dependencies]
aws = ["aioboto3>=15.5.0"]
azure = ["azure-storage-blob>=12.30.0"]
sendgrid = ["sendgrid>=6.12.5", "httpx>=0.28.1"]
redis = ["redis[hiredis]>=8.0.0"]
memcached = ["emcache>=1.3.3; python_version < '3.14'"]
email-oauth = ["authlib>=1.7.2"]
all = [
    "aioboto3>=15.5.0",
    "authlib>=1.7.2",
    "azure-storage-blob>=12.30.0",
    "emcache>=1.3.3; python_version < '3.14'",
    "httpx>=0.28.1",
    "redis[hiredis]>=8.0.0",
    "sendgrid>=6.12.5",
]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "cryptography>=50.0.0",
    "websockets>=15",
    "aioquic>=1.3",
]

[project.scripts]
nitro = "nitro.cli:main"

[tool.maturin]
module-name = "nitro._nitro"
manifest-path = "crates/nitro-py/Cargo.toml"
python-source = "."
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Chosen to encode the project's own guidelines rather than taste: UP keeps the
# modern type syntax, I keeps imports ordered, B and SIM catch the mistakes
# review would otherwise have to, and F catches what is dead.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PIE"]
ignore = [
    # `Depends(...)` as a parameter default is the whole point of the DI
    # surface, and `Query(...)`, `Header(...)` and the rest work the same way.
    "B008",
    # Long lines are reported by E501 already; this one fires on URLs and
    # tables in docstrings where wrapping would read worse.
    "E501",
    # A ternary is not always clearer than the `if` it replaces, and where it
    # is the author can reach for one.
    "SIM108",
    # Typography in prose meant for a person to read: an en dash in CLI output
    # is deliberate, not a mistyped hyphen.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# A test's fixtures and doubles are allowed to be blunter than library code.
"tests/**" = ["B018", "SIM117", "RUF012"]
