[workspace]
resolver = "3"
members = [
    "crates/nitro-core",
    "crates/nitro-observability",
    "crates/nitro-py",
    "crates/intercom-core",
    "crates/intercom-py",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"
authors = ["Mario Ritzerfeld <oss@jaldis.com>"]
repository = "https://github.com/jaldisdev/nitro"

[workspace.dependencies]
nitro-core = { path = "crates/nitro-core", version = "0.1.0" }
nitro-observability = { path = "crates/nitro-observability", version = "0.1.0" }
intercom-core = { path = "crates/intercom-core", version = "0.1.0" }

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io", "rt"] }
futures-util = "0.3.33"

# HTTP/1 + HTTP/2
hyper = { version = "1.11.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.4"

# HTTP/3 + QUIC + WebTransport
quinn = { version = "0.11.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
h3-datagram = "0.0.2"

# TLS
rustls = { version = "0.23.43", default-features = false, features = ["tls12", "ring", "logging", "std"] }
rustls-pemfile = "2.2.0"
# Default features would bring aws-lc-rs. Everything here uses ring, and a
# second crypto provider compiled into the wheel is weight nothing calls.
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }

# WebSocket framing
tokio-tungstenite = "0.30.0"
sha1 = "0.11.0"
base64 = "0.23.1"

# Metrics
prometheus = { version = "0.14.0", default-features = false }

# Routing
matchit = "0.9.2"
regex = "1.12.3"

# Python bindings (binding crates only)
pyo3 = { version = "0.29.2", features = ["abi3-py313"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
libc = "0.2.189"

# Intercom
redis = { version = "1.5.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
rmp-serde = "1.3.1"
rmpv = "1.3.0"
serde = { version = "1.0.229", features = ["derive"] }

# Utility
bytes = "1.12.1"
httpdate = "1.0.3"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# Test-only
tempfile = "3.24.0"
rcgen = "0.14.7"
# Test-only. The provider-less rustls feature is deliberate: `rustls` would
# bring aws-lc-rs, and because rustls is also a normal dependency here the
# feature unifies across the graph and that C library ends up compiled into the
# shipped wheel. The tests install ring instead, which the server already uses.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "http2", "stream"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
