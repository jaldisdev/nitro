[workspace]
resolver = "3"
members = [
    "crates/nitro-core",
    "crates/nitro-py",
    "crates/intercom-core",
    "crates/intercom-py",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"
authors = ["Mario Ritzerfeld <oss@jaldis.com>"]
repository = "https://github.com/jaldis/nitro"

[workspace.dependencies]
nitro-core = { path = "crates/nitro-core", version = "0.1.0" }
intercom-core = { path = "crates/intercom-core", version = "0.1.0" }

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
futures-util = "0.3.33"

# HTTP/1 + HTTP/2
hyper = { version = "1.11.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server-auto", "server-graceful"] }
http = "1.5.0"
http-body-util = "0.1.4"

# HTTP/3 + QUIC + WebTransport
quinn = { version = "0.11.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"

# TLS
rustls = { version = "0.23.43", default-features = false, features = ["tls12", "ring", "logging", "std"] }
rustls-pemfile = "2.2.0"
tokio-rustls = "0.26.4"

# WebSocket framing
tokio-tungstenite = "0.30.0"
sha1 = "0.11.0"
base64 = "0.23.1"

# Routing
matchit = "0.9.2"

# Python bindings (binding crates only)
pyo3 = { version = "0.29.2", features = ["abi3-py313"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
libc = "0.2.189"

# Intercom
redis = { version = "1.5.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }

# Utility
bytes = "1.12.1"
httpdate = "1.0.3"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# Test-only
tempfile = "3.24.0"
rcgen = "0.14.7"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-manual-roots", "http2", "stream"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
