name: Test

on:
  push:
    branches: [canary, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      # Reads the rules from pyproject.toml, so this and a local run agree.
      - run: pip install ruff
      - run: ruff check nitro tests benchmark
      - run: ruff format --check nitro tests benchmark

  rust:
    name: Rust
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # The binding crate is built for abi3-py313, so PyO3 refuses to build
      # against an older interpreter — and the runner's own is older than that.
      # The floor is what to build against: it is the version that has to work.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    services:
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # emcache publishes nothing for 3.14, so the Memcached backend is only
      # exercised by the 3.13 leg of the matrix; on 3.14 its tests skip.
      memcached:
        image: memcached:alpine
        ports: ["11211:11211"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install maturin
      - name: Build and install nitro
        run: |
          maturin build --locked --release -o dist
          pip install "$(ls dist/nitro-*.whl)[dev,all]"
      - name: Build and install nitro-intercom
        working-directory: nitro-intercom
        run: |
          maturin build --locked --release -o dist
          pip install "$(ls dist/nitro_intercom-*.whl)[dev]"
      - run: pytest
      - name: Test nitro-intercom
        working-directory: nitro-intercom
        run: pytest
