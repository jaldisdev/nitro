name: Release

# Wheels carry a compiled server, so there is one per platform rather than one
# pure-Python wheel for everything. The build matrix is what makes a release
# take a while; it runs only on a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (otherwise build and keep the artefacts)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
          - runner: macos-latest
            target: aarch64
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7
      # abi3-py313 means one wheel serves every later Python, so the version
      # built against is the floor rather than one wheel per version.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          # manylinux containers are what make a Linux wheel installable
          # somewhere other than the runner that built it.
          manylinux: auto

      - name: Build nitro-intercom wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # The manifest this builds is named by nitro-intercom's own
          # pyproject.toml, and --out is relative to that directory, so both
          # wheels land in the one dist the upload below collects.
          args: --release --locked --out ../dist
          manylinux: auto
          working-directory: nitro-intercom

      - name: Check the wheels are installable and carry their licence
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/nitro_framework-*.whl
          python -c "import nitro; print('nitro', nitro.__version__)"
          python -c "import nitro._nitro; print('compiled server ok')"
          python -m zipfile -l dist/nitro_framework-*.whl | grep -i LICENSE
          python -m pip install dist/nitro_intercom-*.whl
          python -c "import nitro_intercom; print('nitro-intercom', nitro_intercom.__version__)"
          python -m zipfile -l dist/nitro_intercom-*.whl | grep -i LICENSE

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      # Without one of its own, nitro-intercom would go out wheels-only: no
      # install on a platform the matrix above does not build for, and nothing
      # for a distribution that packages from source.
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ../dist
          working-directory: nitro-intercom
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  crates:
    name: Check intercom-core packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # A release is the two PyPI distributions; no crate goes to crates.io as
      # part of it. intercom-core is checked because it is the one that might
      # be published on its own later, and keeping it packageable is cheaper
      # than discovering it is not on the day.
      #
      # The others are not checked and cannot be: each depends on a sibling
      # that is not on the index, so `cargo package` rewrites the path
      # dependency to a registry one and fails to resolve it. That is a
      # property of publishing them, not of them being broken.
      - run: |
          cargo package -p intercom-core --no-verify
          tar -tzf target/package/intercom-core-*.crate | grep -q LICENSE-MIT \
            || { echo "intercom-core has no licence text"; exit 1; }

  # Two jobs rather than two steps in one. PyPI matches a trusted publisher on
  # (owner, repo, workflow, environment), and a *pending* publisher — one for a
  # project that does not exist on PyPI yet — must be unique on that tuple.
  # Both distributions are published from this one workflow, so the environment
  # is what tells the two configurations apart.
  publish-framework:
    name: Publish nitro-framework to PyPI
    needs: [wheels, sdist, crates]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: PyPI verifies the workflow rather than a token
      # somebody has to store and rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Take the framework distributions
        run: |
          mkdir -p upload
          mv dist/nitro_framework-* upload/
          # What is left should be the other distribution. Something matching
          # neither means the build produced an artefact nobody expected.
          unexpected=$(ls dist | grep -v '^nitro_intercom-' || true)
          test -z "$unexpected" || { echo "unexpected artefacts: $unexpected"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload

  publish-intercom:
    name: Publish nitro-intercom to PyPI
    needs: [wheels, sdist, crates]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: release-intercom
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Take the intercom distributions
        run: |
          mkdir -p upload
          mv dist/nitro_intercom-* upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
