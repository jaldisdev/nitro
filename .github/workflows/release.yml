name: Release

# Wheels carry a compiled server, so there is one per platform rather than one
# pure-Python wheel for everything. The build matrix is what makes a release
# take a while; it runs only on a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (otherwise build and keep the artefacts)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.platform.runner }} ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
          - runner: macos-latest
            target: aarch64
          - runner: macos-13
            target: x86_64
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7
      # abi3-py313 means one wheel serves every later Python, so the version
      # built against is the floor rather than one wheel per version.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist
          # manylinux containers are what make a Linux wheel installable
          # somewhere other than the runner that built it.
          manylinux: auto

      - name: Build nitro-intercom wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # The manifest this builds is named by nitro-intercom's own
          # pyproject.toml, and --out is relative to that directory, so both
          # wheels land in the one dist the upload below collects.
          args: --release --locked --out ../dist
          manylinux: auto
          working-directory: nitro-intercom

      - name: Check the wheels are installable and carry their licence
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/nitro_framework-*.whl
          python -c "import nitro; print('nitro', nitro.__version__)"
          python -c "import nitro._nitro; print('compiled server ok')"
          python -m zipfile -l dist/nitro_framework-*.whl | grep -i LICENSE
          python -m pip install dist/nitro_intercom-*.whl
          python -c "import nitro_intercom; print('nitro-intercom', nitro_intercom.__version__)"
          python -m zipfile -l dist/nitro_intercom-*.whl | grep -i LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      # Without one of its own, nitro-intercom would go out wheels-only: no
      # install on a platform the matrix above does not build for, and nothing
      # for a distribution that packages from source.
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out ../dist
          working-directory: nitro-intercom
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  crates:
    name: Check the crates package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Not published automatically: crates.io releases are ordered by
      # dependency and are worth doing deliberately. This only proves each
      # crate packages, licence files included.
      - run: |
          for crate in nitro-observability nitro-core intercom-core nitro-py intercom-py; do
            cargo package -p "$crate" --no-verify
            tar -tzf "target/package/$crate-"*.crate | grep -q LICENSE-MIT \
              || { echo "$crate has no licence text"; exit 1; }
          done

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist, crates]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: PyPI verifies the workflow rather than a token
      # somebody has to store and rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A trusted publisher mints a token scoped to one project, so the two
      # distributions are uploaded separately rather than from one directory.
      - name: Separate the two distributions
        run: |
          mkdir -p upload/framework upload/intercom
          mv dist/nitro_framework-* upload/framework/
          mv dist/nitro_intercom-* upload/intercom/
          test -z "$(ls -A dist)" || { echo "unexpected artefacts:"; ls dist; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/framework
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/intercom
