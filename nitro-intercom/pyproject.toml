[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "nitro-intercom"
version = "0.1.0"
description = "Publish/subscribe channels for Python services"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Mario Ritzerfeld", email = "oss@jaldis.com" }]
keywords = ["pubsub", "redis", "messagepack", "channels", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/jaldisdev/nitro"
Repository = "https://github.com/jaldisdev/nitro"
Documentation = "https://github.com/jaldisdev/nitro/blob/canary/docs/intercom.md"
Issues = "https://github.com/jaldisdev/nitro/issues"

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.0", "ruff>=0.16"]

[tool.maturin]
module-name = "nitro_intercom._intercom"
manifest-path = "../crates/intercom-py/Cargo.toml"
python-source = "."
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
